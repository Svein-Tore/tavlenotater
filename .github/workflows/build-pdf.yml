name: Build LaTeX and deploy PDFs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full

      # FINN ALLE TEX-FILER
      - name: Find all .tex files
        run: |
          find . -type f -name "*.tex" > texfiles.txt
          echo "Found:"
          cat texfiles.txt

      # BYGG PDF MED PDFLATEX + SHELL ESCAPE
      - name: Build PDFs with pdflatex (supports PSTricks via auto-pst-pdf)
        run: |
          while read file; do
            echo "🧩 Building $file ..."
            dir=$(dirname "$file")
            base=$(basename "$file" .tex)

            # Output directory mirrors repo structure under pdfs/
            outdir="pdfs/$dir"
            mkdir -p "$outdir"

            # RUN PDFLATEX TWICE WITH SHELL-ESCAPE
            pdflatex -shell-escape -interaction=nonstopmode -halt-on-error \
              -output-directory="$outdir" "$file" || exit 1

            pdflatex -shell-escape -interaction=nonstopmode -halt-on-error \
              -output-directory="$outdir" "$file" || exit 1

          done < texfiles.txt

      # GENERER index.html
      - name: Generate HTML index
        run: |
          echo "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>PDFs</title></head><body>" > index.html
          echo "<h1>LaTeX PDF Files</h1>" >> index.html
          echo "<ul>" >> index.html

          find pdfs -type f -name "*.pdf" | sort | while read pdf; do
            clean=$(echo "$pdf" | sed 's|pdfs/||')
            echo "<li><a href=\"$clean\" download>$clean</a></li>" >> index.html
          done

          echo "</ul></body></html>" >> index.html

      # DEPLOY TIL GH-PAGES
      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          publish_branch: gh-pages
          keep_files: false
