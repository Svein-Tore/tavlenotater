name: Build LaTeX PDFs and Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        persist-credentials: true

    - name: Install TeX Live and dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full dvipng ps2pdf texlive-latex-extra

    - name: Find all .tex files
      run: find . -name "*.tex" > texfiles.txt

    - name: Build PDFs preserving folder structure
      run: |
        while read file; do
          echo "🧩 Building $file ..."
          base=$(basename "$file" .tex)
          dir=$(dirname "$file")
          if [ "$dir" = "." ]; then
            outdir="pdfs"
          else
            outdir="pdfs/$dir"
          fi
          mkdir -p "$outdir"

          # Compile using pdflatex
          pdflatex -interaction=nonstopmode -output-directory="$outdir" "$file"
        done < texfiles.txt

    - name: Generate dynamic index.html
      run: |
        echo "<!DOCTYPE html>
        <html lang='no'>
        <head>
        <meta charset='UTF-8'>
        <title>PDF Arkiv</title>
        <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        details { margin-left: 20px; }
        a { text-decoration: none; color: #0066cc; }
        a:hover { text-decoration: underline; }
        </style>
        </head>
        <body>
        <h1>PDF Arkiv</h1>" > pdfs/index.html

        find pdfs -type d | while read dir; do
          rel=$(realpath --relative-to=pdfs "$dir")
          if [ "$rel" != "." ]; then
            echo "<details><summary>$rel</summary><ul>" >> pdfs/index.html
            find "$dir" -maxdepth 1 -type f -name "*.pdf" | while read f; do
              name=$(basename "$f")
              echo "<li><a href=\"$rel/$name\" target=\"_blank\">$name</a></li>" >> pdfs/index.html
            done
            echo "</ul></details>" >> pdfs/index.html
          fi
        done

        echo "</body></html>" >> pdfs/index.html

    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v6
      with:
        personal_token: ${{ secrets.PAT_TOKEN }}
        publish_dir: ./pdfs
        publish_branch: gh-pages
        keep_files: true
