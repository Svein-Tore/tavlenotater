name: Build LaTeX PDFs and Deploy with Interactive Tree

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install LaTeX + PSTricks dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-fonts-extra \
            texlive-pictures \
            texlive-science \
            texlive-pstricks \
            texlive-publishers \
            dvipng ghostscript

      - name: Find all .tex files
        run: find . -name "*.tex" > texfiles.txt

      - name: Build PDFs with PSTricks
        run: |
          mkdir -p pdfs
          FAILED_FILES=""
          while read file; do
            echo "🧩 Building $file ..."
            base=$(basename "$file" .tex)
            dir=$(dirname "$file")
            if [ "$dir" = "." ]; then
              outdir="pdfs"
            else
              outdir="pdfs/$dir"
            fi
            mkdir -p "$outdir"

            if ! pdflatex -shell-escape -interaction=nonstopmode -output-directory="$outdir" "$file"; then
              echo "❌ Failed: $file"
              FAILED_FILES="$FAILED_FILES\n$file"
            fi
          done < texfiles.txt
          echo -e "$FAILED_FILES" > pdfs/build_failures.txt || true

      - name: Generate interactive index.html
        run: |
          echo '<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>PDFs</title>
            <style>
              ul { list-style-type: none; }
              li { margin: 0.3em 0; }
              .folder::before { content: "📁 "; cursor: pointer; }
              .file::before { content: "📄 "; }
            </style>
          </head>
          <body>
            <h1>PDFs</h1>' > pdfs/index.html

          generate_list() {
            local path="$1"
            echo "<ul>" >> pdfs/index.html
            for f in "$path"/*; do
              if [ -d "$f" ]; then
                name=$(basename "$f")
                echo "<li class=\"folder\">$name</li>" >> pdfs/index.html
                generate_list "$f"
              elif [[ "$f" == *.pdf ]]; then
                rel=${f#pdfs/}
                name=$(basename "$f")
                echo "<li class=\"file\"><a href=\"$rel\">$name</a></li>" >> pdfs/index.html
              fi
            done
            echo "</ul>" >> pdfs/index.html
          }

          generate_list pdfs

          echo '
          <script>
          document.addEventListener("DOMContentLoaded", function() {
            const folders = document.querySelectorAll(".folder");
            folders.forEach(folder => {
              const sublist = folder.nextElementSibling;
              if (sublist && sublist.tagName === "UL") {
                sublist.style.display = "none";
                folder.addEventListener("click", () => {
                  sublist.style.display = sublist.style.display === "none" ? "block" : "none";
                });
              }
            });
          });
          </script>
          </body></html>' >> pdfs/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./pdfs
          publish_branch: gh-pages
