name: Build LaTeX PDFs and Deploy

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:

  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install TeX Live + needed tools
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full ghostscript

    - name: Find all .tex files
      run: |
        find . -name "*.tex" > texfiles.txt
        echo "Found these TeX files:"
        cat texfiles.txt

    - name: Build PDFs (latex + dvips + ps2pdf)
      run: |
        mkdir -p pdfs
        while read file; do
          echo "🧩 Building $file ..."
          base=$(basename "$file" .tex)
          dir=$(dirname "$file")

          # output folder
          if [ "$dir" = "." ]; then
            outdir="pdfs"
          else
            outdir="pdfs/$dir"
          fi

          mkdir -p "$outdir"

          # latex -> dvi
          latex -shell-escape -interaction=nonstopmode -output-directory="$outdir" "$file"

          # dvips -> ps
          dvips -o "$outdir/$base.ps" "$outdir/$base.dvi"

          # ps2pdf -> pdf
          ps2pdf "$outdir/$base.ps" "$outdir/$base.pdf"

        done < texfiles.txt


    - name: Generate automatic index.html
      run: |
        python3 - << 'PY'
import os
import html

root = "pdfs"

def build_tree(path):
    entries = []
    for entry in sorted(os.listdir(path)):
        full = os.path.join(path, entry)
        if os.path.isdir(full):
            entries.append({
                "type": "dir",
                "name": entry,
                "children": build_tree(full)
            })
        elif entry.endswith(".pdf"):
            entries.append({
                "type": "pdf",
                "name": entry,
                "path": full.replace("\\", "/")
            })
    return entries

def render(tree, indent=0):
    lines = []
    for item in tree:
        if item["type"] == "dir":
            lines.append(" " * indent + f"<details><summary>{html.escape(item['name'])}</summary>")
            lines.extend(render(item["children"], indent + 2))
            lines.append(" " * indent + "</details>")
        else:
            url = html.escape(item["path"])
            text = html.escape(item["name"])
            lines.append(" " * indent + f'<div><a href="{url}" download>{text}</a></div>')
    return lines

tree = build_tree(root)

html_out = "<!DOCTYPE html><html><head><meta charset='UTF-8'><title>PDF bibliotek</title></head><body>"
html_out += "<h1>PDF bibliotek</h1>\n"
html_out += "\n".join(render(tree))
html_out += "\n</body></html>"

with open("pdfs/index.html", "w") as f:
    f.write(html_out)

PY


    - name: Deploy to gh-pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        personal_token: ${{ secrets.PAT_TOKEN }}
        publish_branch: gh-pages
        publish_dir: pdfs
