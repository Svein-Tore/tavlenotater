name: Build LaTeX PDFs and Deploy with Tree

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install LaTeX + PSTricks dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-recommended \
            texlive-latex-extra texlive-fonts-recommended texlive-pictures \
            dvipng ghostscript

      - name: Find all .tex files
        run: |
          find . -name "*.tex" > texfiles.txt

      - name: Build PDFs with PSTricks
        run: |
          mkdir -p pdfs
          while read file; do
            echo "🧩 Building $file ..."
            base=$(basename "$file" .tex)
            dir=$(dirname "$file")
            if [ "$dir" = "." ]; then
              outdir="pdfs"
            else
              outdir="pdfs/$dir"
            fi
            mkdir -p "$outdir"

            # Compile using latex -> dvips -> ps2pdf (via Ghostscript)
            latex -shell-escape -interaction=nonstopmode -output-directory="$outdir" "$file"
            dvips -o "$outdir/$base.ps" "$outdir/$base.dvi"
            ps2pdf "$outdir/$base.ps" "$outdir/$base.pdf"
          done < texfiles.txt

      - name: Generate index.html with folder tree
        run: |
          echo '<!DOCTYPE html>
          <html>
          <head>
            <meta charset="UTF-8">
            <title>PDFs</title>
            <style>
              ul { list-style-type: none; }
              li { margin: 0.3em 0; }
            </style>
          </head>
          <body>
            <h1>PDFs</h1>' > pdfs/index.html

          generate_list() {
            local path="$1"
            echo "<ul>" >> pdfs/index.html
            for f in "$path"/*; do
              if [ -d "$f" ]; then
                name=$(basename "$f")
                echo "<li><strong>$name</strong></li>" >> pdfs/index.html
                generate_list "$f"
              elif [[ "$f" == *.pdf ]]; then
                rel=${f#pdfs/}
                name=$(basename "$f")
                echo "<li><a href='$rel'>$name</a></li>" >> pdfs/index.html
              fi
            done
            echo "</ul>" >> pdfs/index.html
          }

          generate_list pdfs

          echo '</body></html>' >> pdfs/index.html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.PAT_TOKEN }}
          publish_dir: ./pdfs
          publish_branch: gh-pages
