name: Build and Deploy LaTeX PDFs with PSTricks

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install LaTeX with PSTricks
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full dvipng ghostscript

      - name: Find all .tex files
        run: |
          echo "🔍 Searching for .tex files..."
          find . -type f -name "*.tex" > texfiles.txt
          cat texfiles.txt

      - name: Build PDFs with PSTricks
        run: |
          mkdir -p pdfs
          while read file; do
            echo "🧩 Building $file ..."
            base=$(basename "$file" .tex)
            outdir="pdfs/$(dirname "$file" | sed 's|^\./||')"
            mkdir -p "$outdir"

            # Compile using latex -> dvips -> ps2pdf
            latex -interaction=nonstopmode -output-directory="$outdir" "$file"
            dvips -o "$outdir/$base.ps" "$outdir/$base.dvi"
            ps2pdf "$outdir/$base.ps" "$outdir/$base.pdf"
          done < texfiles.txt

      - name: Clean auxiliary files
        run: |
          find pdfs -type f \( -name "*.aux" -o -name "*.log" -o -name "*.out" -o -name "*.fls" -o -name "*.fdb_latexmk" -o -name "*.dvi" -o -name "*.ps" \) -delete

      - name: List generated PDFs
        run: |
          echo "📂 PDFs ready for deploy:"
          find pdfs -type f -name "*.pdf"

      - name: Deploy PDFs to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pdfs
          keep_files: true
          user_name: github-actions
          user_email: github-actions@github.com
