name: Build and Deploy LaTeX PDFs with PSTricks + Index

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Install LaTeX with PSTricks
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-full dvipng ghostscript

      - name: Find all .tex files
        run: |
          echo "🔍 Searching for .tex files..."
          find . -type f -name "*.tex" > texfiles.txt
          cat texfiles.txt

      - name: Build PDFs with PSTricks
        run: |
          mkdir -p pdfs
          while read file; do
            echo "🧩 Building $file ..."
            base=$(basename "$file" .tex)
            dir=$(dirname "$file")
            if [ "$dir" = "." ]; then
              outdir="pdfs"
            else
              outdir="pdfs/$dir"
            fi
            mkdir -p "$outdir"

            # Compile using latex -> dvips -> ps2pdf
            latex -interaction=nonstopmode -output-directory="$outdir" "$file"
            dvips -o "$outdir/$base.ps" "$outdir/$base.dvi"
            ps2pdf "$outdir/$base.ps" "$outdir/$base.pdf"
          done < texfiles.txt

      - name: Clean auxiliary files
        run: |
          find pdfs -type f \( -name "*.aux" -o -name "*.log" -o -name "*.out" -o -name "*.fls" -o -name "*.fdb_latexmk" -o -name "*.dvi" -o -name "*.ps" \) -delete

      - name: Generate foldable index.html
        run: |
          INDEX="pdfs/index.html"
          echo "<!DOCTYPE html><html lang='no'><head><meta charset='utf-8'><title>PDF Oversikt</title>" > $INDEX
          echo "<style>
          body { font-family: Arial, sans-serif; margin: 2em; background: #f4f6f8; }
          h1 { color: #2c3e50; }
          ul { list-style-type: none; padding-left: 1em; }
          li { margin: 0.2em 0; }
          .folder { font-weight: bold; cursor: pointer; }
          .file a { text-decoration: none; color: #2c3e50; }
          .file a:hover { text-decoration: underline; color: #e74c3c; }
          .hidden { display: none; }
          </style>
          <script>
          function toggle(event) {
            const next = event.nextElementSibling;
            if(next) next.classList.toggle('hidden');
          }
          </script>
          </head><body>" >> $INDEX
          echo "<h1>📚 Tavlenotater og prøver</h1>" >> $INDEX

          list_dir() {
            local dir="$1"
            echo "<ul>" >> $INDEX
            for f in "$dir"/*; do
              if [ -d "$f" ]; then
                name=$(basename "$f")
                echo "<li class='folder' onclick='toggle(this)'>📁 $name</li>" >> $INDEX
                echo "<ul class='hidden'>" >> $INDEX
                list_dir "$f"
                echo "</ul>" >> $INDEX
              elif [[ "$f" == *.pdf ]]; then
                rel="${f#pdfs/}"
                echo "<li class='file'>📘 <a href='$rel' target='_blank'>$rel</a></li>" >> $INDEX
              fi
            done
            echo "</ul>" >> $INDEX
          }

          list_dir pdfs
          echo "</body></html>" >> $INDEX

      - name: Deploy PDFs and index.html to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: pdfs
          keep_files: true
          user_name: github-actions
          user_email: github-actions@github.com
