name: Build LaTeX PDFs with safe filenames

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Sanitize filenames and directories
      run: |
        shopt -s globstar
        sanitize() {
          local name="$1"
          name="${name// /_}"
          name="${name//æ/ae}"
          name="${name//ø/oe}"
          name="${name//å/aa}"
          name="${name//[^a-zA-Z0-9_./-]/}"
          echo "$name"
        }

        # Rename directories first (deepest first)
        for dir in **/; do
          newdir=$(sanitize "$dir")
          if [[ "$dir" != "$newdir" ]]; then
            mv -v "$dir" "$newdir"
          fi
        done

        # Then rename files
        for file in **/*; do
          if [[ -f "$file" ]]; then
            newfile=$(sanitize "$file")
            if [[ "$file" != "$newfile" ]]; then
              mv -v "$file" "$newfile"
            fi
          fi
        done

    - name: Install TeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full dvipng ghostscript psutils

    - name: Build PDFs with auto-pst-pdf
      run: |
        mkdir -p pdfs
        while read file; do
          echo "🧩 Building $file ..."
          base=$(basename "$file" .tex)
          dir=$(dirname "$file")
          if [ "$dir" = "." ]; then
            outdir="pdfs"
          else
            outdir="pdfs/$dir"
          fi
          mkdir -p "$outdir"
          pdflatex -shell-escape -interaction=nonstopmode -output-directory="$outdir" "$file"
        done < <(find . -name "*.tex")

    - name: Upload PDFs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: latex-pdfs
        path: pdfs/

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.PAT_TOKEN }}
        publish_dir: ./pdfs
