name: Build PDFs and Deploy

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v3

    - name: Install TeX
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive texlive-latex-extra texlive-pictures texlive-fonts-recommended texlive-lang-european ghostscript psutils

    - name: Enable shell escape
      run: echo "export LATEX_OPTS='-shell-escape'" >> $GITHUB_ENV

    - name: Find .tex files
      run: |
        find . -name "*.tex" > texfiles.txt
        mkdir -p pdfs

    - name: Build PDFs
      run: |
        while read file; do
          echo "Building $file"
          base=$(basename "$file" .tex)
          dir=$(dirname "$file")

          outdir="pdfs/$dir"
          mkdir -p "$outdir"

          latex -interaction=nonstopmode -shell-escape -output-directory="$outdir" "$file"
          dvips -o "$outdir/$base.ps" "$outdir/$base.dvi"
          ps2pdf "$outdir/$base.ps" "$outdir/$base.pdf"
        done < texfiles.txt

    - name: Generate dynamic index.html
      run: |
        cat > pdfs/index.html << 'EOF'
<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8">
<title>Mapper og PDF-filer</title>
<style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f4f4f4; }
    ul { list-style-type: none; padding-left: 20px; }
    li { margin: 4px 0; cursor: pointer; }
    .folder::before { content: "📁 "; }
    .file::before { content: "📄 "; }
    .nested { display: none; }
    .active { display: block; }
</style>
</head>
<body>
<h1>Mapper og filer</h1>
<div id="tree">Laster mapper…</div>

<script>
async function fetchDir(path) {
    const url = path ? path + "/" : "";
    const res = await fetch(url);
    const text = await res.text();
    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "text/html");
    return [...doc.querySelectorAll("a")]
      .map(a => a.getAttribute("href"))
      .filter(h => h && h !== "../")
      .map(h => h.replace(/\/$/, ""));
}

async function build(path, parent) {
    const entries = await fetchDir(path);
    for (const e of entries) {
        const full = path ? path + "/" + e : e;
        const li = document.createElement("li");

        if (e.endsWith(".pdf")) {
            li.classList.add("file");
            const a = document.createElement("a");
            a.href = full;
            a.textContent = e;
            a.target = "_blank";
            li.appendChild(a);
            parent.appendChild(li);
        } else {
            li.classList.add("folder");
            li.textContent = e;
            const nested = document.createElement("ul");
            nested.classList.add("nested");
            li.appendChild(nested);
            li.onclick = async (ev) => {
                ev.stopPropagation();
                if (nested.childElementCount === 0) await build(full, nested);
                nested.classList.toggle("active");
            };
            parent.appendChild(li);
        }
    }
}

(async () => {
    const root = document.createElement("ul");
    document.getElementById("tree").innerHTML = "";
    document.getElementById("tree").appendChild(root);
    await build("", root);
})();
</script>
</body>
</html>
EOF

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: pdfs
