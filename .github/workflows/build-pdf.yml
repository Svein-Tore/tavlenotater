name: Build and deploy LaTeX PDFs

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Install TeX dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y texlive-full dvipng ghostscript psutils

    - name: Sanitize filenames
      run: |
        shopt -s globstar
        sanitize() {
          local name="$1"
          name="${name// /_}"
          name="${name//æ/ae}"
          name="${name//ø/oe}"
          name="${name//å/aa}"
          name="${name//[^a-zA-Z0-9_./-]/}"
          echo "$name"
        }

        # Rename directories (deepest first)
        for dir in **/; do
          newdir=$(sanitize "$dir")
          if [[ "$dir" != "$newdir" ]]; then
            mv -v "$dir" "$newdir"
          fi
        done

        # Rename files
        for file in **/*; do
          if [[ -f "$file" ]]; then
            newfile=$(sanitize "$file")
            if [[ "$file" != "$newfile" ]]; then
              mv -v "$file" "$newfile"
            fi
          fi
        done

    - name: Build PDFs
      run: |
        mkdir -p pdfs
        while read file; do
          base=$(basename "$file" .tex)
          dir=$(dirname "$file")
          if [ "$dir" = "." ]; then
            outdir="pdfs"
          else
            outdir="pdfs/$dir"
          fi
          mkdir -p "$outdir"
          pdflatex -shell-escape -interaction=nonstopmode -output-directory="$outdir" "$file"
        done < <(find . -name "*.tex")

    - name: Generate index.html
      run: |
        echo "<!DOCTYPE html><html><body><h1>PDFs</h1><ul>" > pdfs/index.html
        find pdfs -type f -name "*.pdf" | sort | while read f; do
          rel=${f#pdfs/}
          echo "<li><a href='$rel'>$rel</a></li>" >> pdfs/index.html
        done
        echo "</ul></body></html>" >> pdfs/index.html

    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.PAT_TOKEN }}
        publish_dir: ./pdfs
